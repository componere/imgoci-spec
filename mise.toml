# mise manages every non-system tool used for local and CI validation.
#
# The generated mise.lock resolves each tool for Linux and macOS on x86-64 and
# ARM64. Locked mode makes installation fail when the current platform is not
# represented by a pre-resolved URL and checksum.
#
# Bump a tool by updating its version below, then run:
#   mise lock --platform linux-x64,linux-arm64,macos-x64,macos-arm64

[tools]
python = "3.14.3"
"aqua:astral-sh/uv" = "0.11.0"
"aqua:cue-lang/cue" = "0.17.1"
"aqua:moonrepo/moon" = "2.3.5"

[env]
# Moon must use the binaries installed by mise instead of installing its own
# toolchains.
MOON_TOOLCHAIN_FORCE_GLOBALS = "true"

[settings]
lockfile = true
locked = true
