name: Validate

on:
  push:
    branches:
      - master
  pull_request:
  workflow_call:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MOON_TOOLCHAIN_FORCE_GLOBALS: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.6.14
          cache: true

      - name: Run Moon CI
        run: moon ci --force --summary minimal
