# Required release app settings:
# - vars.IMGOCI_RELEASE_APP_CLIENT_ID
# - secrets.IMGOCI_RELEASE_APP_PRIVATE_KEY
# - contents, issues, and pull requests write permissions on the
#   imgoci-release-please GitHub App installation.
#
# The App token allows the v* tag created by Release Please to trigger the
# separate publication workflow.

name: Release Please

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Create release app token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.IMGOCI_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.IMGOCI_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Run Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.release-app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
