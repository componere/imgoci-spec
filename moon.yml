project:
  title: 'imgoci-spec'
  description: 'Specification, schemas, and conformance cases for imgoci.'
  owner: 'imgoci'
  maintainers:
    - 'imgoci'

# mise owns the tool versions; Moon only orchestrates them.
toolchains:
  default: 'system'

workspace:
  inheritedTasks:
    include: []

tasks:
  cue:
    command: 'sh scripts/check_cue.sh'
    inputs: []
    options:
      cache: false
      runInCI: true
